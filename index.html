<style>
/* Concepto: tablones de madera oscura como fondo fijo; cada obra es un panel de vidrio líquido con su QR sobre un azulejo claro para que escanee bien. */
:root {
  --wood-deep: #24160d;
  --wood: #3a2415;
  --wood-warm: #5b3a22;
  --edge: rgba(255, 236, 210, 0.30);
  --ink: #f7ede1;
  --ink-dim: rgba(247, 237, 225, 0.72);
  --honey: #e9b977;
  --paper: #fbf7f0;
  --qr-ink: #1d130b;
  --font-display: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: auto; }
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

body {
  background: var(--wood);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}

/* Banda bajo la barra del sistema */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--wood-deep);
}

/* Madera: tablones verticales, veta y viñeta */
.wood {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-color: var(--wood);
  background-image:
    radial-gradient(120% 90% at 50% 0%, rgba(255, 200, 140, 0.16), transparent 60%),
    radial-gradient(140% 100% at 50% 100%, rgba(0, 0, 0, 0.55), transparent 65%),
    repeating-linear-gradient(90deg,
      rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 214px,
      rgba(0, 0, 0, 0.42) 215px, rgba(255, 215, 165, 0.07) 217px,
      rgba(0, 0, 0, 0) 218px, rgba(0, 0, 0, 0) 236px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9 0.011' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 1.5 -0.55'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>"),
    linear-gradient(90deg, var(--wood-warm), var(--wood) 40%, var(--wood-warm) 70%, var(--wood));
  background-size: auto, auto, 236px 100%, 480px 480px, auto;
}

/* Vidrio líquido */
.glass {
  position: relative;
  background: linear-gradient(145deg, rgba(255, 240, 220, 0.17), rgba(255, 240, 220, 0.05));
  border: 1px solid var(--edge);
  border-radius: 26px;
  -webkit-backdrop-filter: blur(20px) saturate(165%);
  backdrop-filter: blur(20px) saturate(165%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.38),
    inset 0 -1px 0 rgba(0, 0, 0, 0.28),
    0 22px 44px -22px rgba(0, 0, 0, 0.7);
}
.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  background: radial-gradient(120% 55% at 18% 0%, rgba(255, 255, 255, 0.20), transparent 60%);
  pointer-events: none;
}
.glass > * { position: relative; z-index: 1; }

/* Barra de menú: banda opaca de ancho completo para que el contenido
   no se vea a través de ella ni por encima al hacer scroll. */
.bar {
  position: sticky;
  top: 0;
  z-index: 20;
  margin-inline: -16px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  display: flex;
  justify-content: center;
  background: var(--wood-deep);
}
.bar-in {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  max-width: 640px;
  padding: 6px 8px 6px 22px;
  border-radius: 999px;
  background: linear-gradient(145deg, rgba(70, 45, 28, 0.97), rgba(40, 24, 14, 0.97));
}
.brand {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.chips {
  display: flex;
  flex: 1;
  gap: 4px;
  min-width: 0;
}
.chips a {
  flex: 1 1 0;
  min-width: 0;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  color: var(--ink);
  text-decoration: none;
  font-weight: 700;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  border: 1px solid transparent;
  background: rgba(255, 240, 220, 0.12);
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.chips a:hover { background: rgba(233, 185, 119, 0.28); border-color: var(--edge); color: #fff; }
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--honey);
  outline-offset: 3px;
}

@media (max-width: 559px) {
  .brand { display: none; }
  .bar-in { padding: 6px; }
}

/* Línea de avance de lectura */
.progress {
  position: fixed;
  left: 0;
  right: 0;
  top: env(safe-area-inset-top, 0px);
  height: 4px;
  z-index: 30;
  background: rgba(255, 240, 220, 0.10);
}
.progress span {
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: 0 50%;
  transform: scaleX(var(--p, 0));
  background: linear-gradient(90deg, #c98f4e, var(--honey), #ffe2b0);
  box-shadow: 0 0 10px rgba(233, 185, 119, 0.7);
}

main { max-width: 1120px; margin-inline: auto; }

.hero { padding-block: 28px 30px; }
.eyebrow {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--honey);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(40px, 7.5vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.04em;
  text-wrap: balance;
}
h1 em { color: var(--honey); font-style: normal; }
.lead {
  margin: 16px 0 0;
  max-width: 46ch;
  color: var(--ink-dim);
  font-size: 16px;
}

/* Rejilla */
.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 0;
  margin: 0;
  list-style: none;
}
@media (min-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 980px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px;
  min-width: 0;
  scroll-margin-top: 96px;
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform 0.25s ease; }
}
@media (prefers-reduced-motion: no-preference) and (hover: hover) {
  .card:hover { transform: translateY(-3px); }
}
.card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  min-width: 0;
}
.num {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--honey);
  font-variant-numeric: tabular-nums;
}
.host {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
}
.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: -0.02em;
  line-height: 1.15;
  min-height: calc(2 * 1.15em);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
/* Autores: etiqueta + un nombre por línea, con guion miel. */
.authors { margin: -6px 0 0; display: flex; flex-direction: column; gap: 3px; }
.authors .a-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--honey);
}
.authors .a-name { font-size: 13.5px; line-height: 1.35; color: var(--ink); }
.authors .a-name::before { content: "—  "; color: var(--honey); }

/* El QR y los botones van pegados abajo: así en PC todas las tarjetas
   de una fila quedan alineadas aunque los títulos tengan 1 o 2 líneas. */
.card .qr-btn { margin-top: auto; }
.card .open { width: 100%; }
.dl-btn { cursor: pointer; font-family: inherit; background: rgba(233, 185, 119, 0.16); }

.qr-btn {
  display: block;
  width: min(100%, 220px);
  margin-inline: auto;
  padding: 0;
  border: 0;
  background: none;
  border-radius: 18px;
  cursor: zoom-in;
  color: inherit;
  font: inherit;
}
.qr {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  padding: 12px;
  border-radius: 18px;
  background: var(--paper);
  color: var(--qr-ink);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06), 0 8px 20px -10px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}
.qr canvas, .qr img { width: 100%; height: auto; max-width: 100%; display: block; }
.qr.qr-missing { font-size: 12px; text-align: center; }

.open {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 16px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgba(255, 240, 220, 0.10);
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
  font-size: 13px;
  transition: background 0.2s;
}
.open:hover { background: rgba(233, 185, 119, 0.28); }

/* QR ampliado */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(20, 11, 5, 0.62);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.modal-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(100%, 520px);
  max-height: 100%;
  overflow-y: auto;
  padding: 18px;
  background: linear-gradient(145deg, rgba(70, 45, 28, 0.88), rgba(40, 24, 14, 0.9));
}
.modal-card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 25px;
  letter-spacing: -0.02em;
  line-height: 1.15;
  text-wrap: balance;
}
.modal-card .authors { margin: 0; }
.modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.modal-actions > * { flex: 1 1 140px; cursor: pointer; font-family: inherit; }
.modal[hidden] { display: none; }
#m-qr { width: min(100%, 62vh); margin-inline: auto; }

/* Visor: encabezado con flechas, cuerpo animado y bloqueo del scroll de fondo */
.modal { overscroll-behavior: contain; }
.modal-card { overscroll-behavior: contain; touch-action: pan-y; }
html.modal-open { overflow: hidden; scrollbar-gutter: stable; }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.m-head .eyebrow { margin: 0; }
.m-nav { display: flex; gap: 8px; }
.nav-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgba(255, 240, 220, 0.12);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s;
}
.nav-btn:hover { background: rgba(233, 185, 119, 0.28); }
.m-body { display: flex; flex-direction: column; gap: 12px; }
.m-hint { display: none; margin: 0; text-align: center; font-size: 12px; color: var(--ink-dim); }
@media (hover: none) { .m-hint { display: block; } }
@keyframes swapNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes swapPrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: no-preference) {
  .m-body.swap-next { animation: swapNext 0.28s ease both; }
  .m-body.swap-prev { animation: swapPrev 0.28s ease both; }
}

/* Aviso breve (enlace copiado, errores) */
.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 60;
  max-width: calc(100% - 32px);
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgba(36, 22, 13, 0.94);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
}

/* Celulares: menos costo de pintado al desplazarse */
@media (max-width: 559px) {
  .glass { -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .card { content-visibility: auto; contain-intrinsic-size: auto 520px; }
}
</style>

    function slug(s) {
      return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'obra';
    }
    function fileName(o) { return 'QR-obra-' + o.n + '-' + slug(o.t) + '.png'; }

    /* Aviso breve */
    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2400);
    }

    /* Lámina descargable: número, título y QR grande con margen blanco, lista para imprimir */
    var POSTER_W = 1200, POSTER_M = 96, POSTER_BOX = POSTER_W - POSTER_M * 2, POSTER_PAD = 88;
    var FONT = "Geist, system-ui, -apple-system, 'Segoe UI', sans-serif";

    function wrapText(ctx, text, maxW) {
      var words = String(text).split(/\s+/), lines = [], line = '';
      words.forEach(function (w) {
        var test = line ? line + ' ' + w : w;
        if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; }
        else { line = test; }
      });
      if (line) lines.push(line);
      return lines;
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function qrCanvas(url, size) {
      if (typeof QRCode === 'undefined') throw new Error('QRCode no disponible');
      var tmp = document.createElement('div');
      tmp.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + size + 'px;height:' + size + 'px;';
      document.body.appendChild(tmp);
      var c = null;
      try {
        new QRCode(tmp, {
          text: encodeURI(url),
          width: size,
          height: size,
          colorDark: '#1d130b',
          colorLight: '#fbf7f0',
          correctLevel: QRCode.CorrectLevel.M
        });
        c = tmp.querySelector('canvas');
      } finally {
        tmp.remove();
      }
      if (!c) throw new Error('Sin canvas');
      return c;
    }
    function fontsReady() {
      try {
        if (document.fonts && document.fonts.load) {
          return Promise.all([
            document.fonts.load('700 30px Geist'),
            document.fonts.load('600 60px Geist'),
            document.fonts.load('500 32px Geist')
          ]).catch(function () {});
        }
      } catch (e) {}
      return Promise.resolve();
    }
    function makePoster(o) {
      return fontsReady().then(function () {
        var inner = POSTER_BOX - POSTER_PAD * 2;
        var qr = qrCanvas(o.u, inner);
        var probe = document.createElement('canvas').getContext('2d');
        probe.font = '600 60px ' + FONT;
        var lines = wrapText(probe, o.t, POSTER_BOX);
        var titleH = lines.length * 72;
        var H = POSTER_M + 34 + 18 + titleH + 40 + POSTER_BOX + 40 + 36 + POSTER_M;

        var cv = document.createElement('canvas');
        cv.width = POSTER_W;
        cv.height = H;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fbf7f0';
        ctx.fillRect(0, 0, POSTER_W, H);
        ctx.textBaseline = 'top';

        var y = POSTER_M;
        ctx.fillStyle = '#a9692a';
        ctx.font = '700 30px ' + FONT;
        try { ctx.letterSpacing = '6px'; } catch (e) {}
        ctx.fillText('OBRA ' + o.n, POSTER_M, y);
        try { ctx.letterSpacing = '0px'; } catch (e) {}
        y += 34 + 18;

        ctx.fillStyle = '#1d130b';
        ctx.font = '600 60px ' + FONT;
        lines.forEach(function (ln, i) { ctx.fillText(ln, POSTER_M, y + i * 72); });
        y += titleH + 40;

        ctx.strokeStyle = 'rgba(29, 19, 11, 0.16)';
        ctx.lineWidth = 3;
        roundRect(ctx, POSTER_M + 1.5, y + 1.5, POSTER_BOX - 3, POSTER_BOX - 3, 32);
        ctx.stroke();
        ctx.drawImage(qr, POSTER_M + POSTER_PAD, y + POSTER_PAD, inner, inner);
        y += POSTER_BOX + 40;

        ctx.fillStyle = 'rgba(29, 19, 11, 0.68)';
        ctx.font = '500 32px ' + FONT;
        ctx.fillText(host(o.u), POSTER_M, y);

        return new Promise(function (resolve, reject) {
          cv.toBlob(function (b) { if (b) resolve(b); else reject(new Error('toBlob')); }, 'image/png');
        });
      });
    }

    var posters = {};
    function posterFor(o) {
      var p = posters[o.n];
      if (p) return p.promise;
      p = posters[o.n] = { blob: null, file: null };
      p.promise = makePoster(o).then(function (blob) {
        p.blob = blob;
        try { p.file = new File([blob], fileName(o), { type: 'image/png' }); } catch (e) {}
        return p;
      }, function (err) {
        delete posters[o.n];
        throw err;
      });
      return p.promise;
    }

    function saveBlob(blob, name) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }
    function downloadQR(o) {
      posterFor(o).then(function (p) {
        saveBlob(p.blob, fileName(o));
      }, function () {
        toast('No se pudo generar el código. Usa el botón Abrir obra.');
      });
    }

    /* Compartir: menú nativo del celular con la lámina; si no existe, copia el enlace */
    function copyLink(o) {
      function legacy() {
        var t = document.createElement('textarea');
        t.value = o.u;
        t.setAttribute('readonly', '');
        t.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;';
        document.body.appendChild(t);
        t.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        t.remove();
        toast(ok ? 'Enlace copiado' : 'No se pudo copiar el enlace');
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(o.u).then(function () { toast('Enlace copiado'); }, legacy);
      } else {
        legacy();
      }
    }
    function shareObra(o) {
      if (!navigator.share) { copyLink(o); return; }
      function go(p) {
        var data;
        if (p && p.file && navigator.canShare && navigator.canShare({ files: [p.file] })) {
          data = { files: [p.file], title: o.t, text: o.t + '\n' + o.u };
        } else {
          data = { title: o.t, text: o.t, url: o.u };
        }
        try {
          var r = navigator.share(data);
          if (r && r.catch) r.catch(function (e) { if (!e || e.name !== 'AbortError') copyLink(o); });
        } catch (e) {
          copyLink(o);
        }
      }
      var cached = posters[o.n];
      if (cached && cached.file) { go(cached); return; }   // inmediato: conserva el gesto del usuario
      posterFor(o).then(go, function () { go(null); });
    }

    var grid = document.getElementById('grid');
    var chips = document.getElementById('chips');
    document.getElementById('count').textContent = OBRAS.length + ' obras';

    OBRAS.forEach(function (o) {
      var chip = document.createElement('a');
      chip.href = '#obra-' + o.n;
      chip.textContent = o.n;
      chip.setAttribute('aria-label', 'Ir a la obra ' + o.n + ': ' + o.t);
      chip.title = o.t;
      chips.appendChild(chip);

      var li = document.createElement('li');
      li.className = 'card glass';
      li.id = 'obra-' + o.n;
      li.innerHTML =
        '<div class="card-top"><span class="num">' + o.n + '</span><span class="host">' + esc(host(o.u)) + '</span></div>' +
        '<h2>' + esc(o.t) + '</h2>' +
        '<div class="authors">' + authorsHTML(o) + '</div>' +
        '<button class="qr-btn" type="button" aria-label="Ampliar el código QR de ' + esc(o.t) + '"><div class="qr" role="img" aria-label="Código QR de ' + esc(o.t) + '"></div></button>' +
        '<a class="open" href="' + esc(o.u) + '" target="_blank" rel="noopener noreferrer">Abrir obra</a>' +
        '<button class="open dl-btn" type="button">Descargar QR</button>';
      grid.appendChild(li);

      drawQR(li.querySelector('.qr'), o.u, 360);
      li.querySelector('.qr-btn').addEventListener('click', function () { openModal(o); });
      li.querySelector('.dl-btn').addEventListener('click', function () { downloadQR(o); });
    });

    var modal = document.getElementById('modal');
    var mBody = document.getElementById('m-body');
    var mCard = document.getElementById('m-card');
    var lastFocus = null;
    var modalObra = null;

    function showInModal(o, dir) {
      modalObra = o;
      document.getElementById('m-num').textContent = 'Obra ' + o.n + ' de ' + OBRAS.length;
      document.getElementById('m-title').textContent = o.t;
      document.getElementById('m-authors').innerHTML = authorsHTML(o);
      document.getElementById('m-open').href = o.u;
      var box = document.getElementById('m-qr');
      box.setAttribute('aria-label', 'Código QR de ' + o.t);
      drawQR(box, o.u, 520);
      mBody.classList.remove('swap-next', 'swap-prev');
      if (dir) {
        void mBody.offsetWidth;
        mBody.classList.add(dir > 0 ? 'swap-next' : 'swap-prev');
      }
      posterFor(o).catch(function () {});   // lo deja listo para descargar o compartir
    }
    function openModal(o) {
      lastFocus = document.activeElement;
      showInModal(o, 0);
      modal.hidden = false;
      document.documentElement.classList.add('modal-open');
      document.getElementById('m-close').focus();
    }
    function closeModal() {
      modal.hidden = true;
      document.documentElement.classList.remove('modal-open');
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    function stepModal(d) {
      if (!modalObra) return;
      var i = OBRAS.indexOf(modalObra);
      showInModal(OBRAS[(i + d + OBRAS.length) % OBRAS.length], d);
    }

    document.getElementById('m-close').addEventListener('click', closeModal);
    document.getElementById('m-dl').addEventListener('click', function () { if (modalObra) downloadQR(modalObra); });
    document.getElementById('m-share').addEventListener('click', function () { if (modalObra) shareObra(modalObra); });
    document.getElementById('m-prev').addEventListener('click', function () { stepModal(-1); });
    document.getElementById('m-next').addEventListener('click', function () { stepModal(1); });
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (modal.hidden) return;
      if (e.key === 'Escape') closeModal();
      else if (e.key === 'ArrowLeft') stepModal(-1);
      else if (e.key === 'ArrowRight') stepModal(1);
    });

    /* Deslizar hacia los lados cambia de obra; tocar fuera del recuadro no mueve la página de atrás */
    var sx = 0, sy = 0, swiping = false;
    mCard.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { swiping = false; return; }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      swiping = true;
    }, { passive: true });
    mCard.addEventListener('touchend', function (e) {
      if (!swiping) return;
      swiping = false;
      var t = e.changedTouches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) stepModal(dx < 0 ? 1 : -1);
    }, { passive: true });
    modal.addEventListener('touchmove', function (e) {
      if (!e.target.closest('.modal-card')) e.preventDefault();
    }, { passive: false });

    var bar = document.getElementById('progress');
    var ticking = false;
    function updateProgress() {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
      bar.style.setProperty('--p', p.toFixed(4));
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { ticking = true; requestAnimationFrame(updateProgress); }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    updateProgress();
  }

  // Si la librería del QR no cargó desde el primer CDN, se intenta con otro antes de dibujar.
  if (typeof QRCode !== 'undefined') { start(); return; }
  var fb = document.createElement('script');
  fb.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
  fb.onload = start;
  fb.onerror = start;
  document.head.appendChild(fb);
})();
</script>

</body></html>
